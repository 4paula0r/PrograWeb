<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Empleados</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f2f2f2;
    padding: 30px 15px;
  }

  .contenedor {
    max-width: 480px;
    margin: 0 auto;
    background-color: #ffffff;
    padding: 25px 30px;
    border: 1px solid #ccc;
  }

  h1 {
    font-size: 20px;
  }

  .campo {
    margin-bottom: 15px;
  }

  label {
    display: block;
    font-weight: bold;
    margin-bottom: 5px;
  }

  input[type="text"],
  input[type="number"],
  input[type="password"] {
    width: 100%;
    padding: 8px;
    border: 1px solid #999;
  }

  .error {
    color: red;
    font-size: 13px;
  }

  #mensaje-exito {
    background-color: #eafaf1;
    color: green;
    border: 1px solid green;
    padding: 10px;
    margin-bottom: 15px;
    display: none;
  }

  button {
    background-color: #2c3e50;
    color: white;
    border: none;
    padding: 10px 20px;
    font-size: 15px;
  }
</style>
</head>
<body>

<div class="contenedor">
  <h1>Registro de nuevo empleado</h1>

  <div id="mensaje-exito">Registro exitoso. El empleado fue registrado correctamente.</div>

  <form id="form-registro" onsubmit="return validarFormulario()" novalidate>

    <div class="campo">
      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre">
      <p class="error" id="error-nombre"></p>
    </div>

    <div class="campo">
      <label for="correo">Correo electrónico</label>
      <input type="text" id="correo" placeholder="usuario@correo.com">
      <p class="error" id="error-correo"></p>
    </div>

    <div class="campo">
      <label for="edad">Edad</label>
      <input type="number" id="edad">
      <p class="error" id="error-edad"></p>
    </div>

    <div class="campo">
      <label for="password">Contraseña</label>
      <input type="password" id="password">
      <p class="error" id="error-password"></p>
    </div>

    <div class="campo">
      <label for="confirmar">Confirmar contraseña</label>
      <input type="password" id="confirmar">
      <p class="error" id="error-confirmar"></p>
    </div>

    <div class="campo">
      <label>Género</label>
      <input type="radio" id="genero-m" name="genero" value="Masculino"> Masculino
      <input type="radio" id="genero-f" name="genero" value="Femenino"> Femenino
      <p class="error" id="error-genero"></p>
    </div>

    <div class="campo">
      <input type="checkbox" id="terminos"> Acepto los términos y condiciones
      <p class="error" id="error-terminos"></p>
    </div>

    <button type="submit">Registrar</button>

  </form>
</div>


<script>

  // Esta función muestra un texto de error dentro del párrafo indicado
  function mostrarError(idError, mensaje) {
    document.getElementById(idError).textContent = mensaje;
  }

  // Esta función borra el texto de error (cuando el campo ya está correcto)
  function ocultarError(idError) {
    document.getElementById(idError).textContent = "";
  }

  // Esta es la función principal. Se ejecuta cuando el usuario presiona "Registrar"
  function validarFormulario() {

    let formularioValido = true; // empezamos asumiendo que todo está bien

    // 1. Nombre completo: obligatorio y mínimo 5 caracteres
    let nombre = document.getElementById("nombre").value.trim();
    if (nombre === "") {
      mostrarError("error-nombre", "El nombre completo es obligatorio.");
      formularioValido = false;
    } else if (nombre.length < 5) {
      mostrarError("error-nombre", "Debe contener al menos 5 caracteres.");
      formularioValido = false;
    } else {
      ocultarError("error-nombre");
    }

    // 2. Correo electrónico: obligatorio y con formato válido (usuario@correo.com)
    let correo = document.getElementById("correo").value.trim();
    let formatoCorreo = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (correo === "") {
      mostrarError("error-correo", "El correo electrónico es obligatorio.");
      formularioValido = false;
    } else if (!formatoCorreo.test(correo)) {
      mostrarError("error-correo", "El correo debe tener un formato válido, ejemplo: usuario@correo.com");
      formularioValido = false;
    } else {
      ocultarError("error-correo");
    }

    // 3. Edad: obligatoria, debe estar entre 18 y 65
    let edadTexto = document.getElementById("edad").value.trim();
    let edad = Number(edadTexto);
    if (edadTexto === "") {
      mostrarError("error-edad", "La edad es obligatoria.");
      formularioValido = false;
    } else if (isNaN(edad) || edad < 18 || edad > 65) {
      mostrarError("error-edad", "La edad debe ser un número entre 18 y 65 años.");
      formularioValido = false;
    } else {
      ocultarError("error-edad");
    }

    // 4. Contraseña: obligatoria y mínimo 8 caracteres
    let password = document.getElementById("password").value;
    if (password === "") {
      mostrarError("error-password", "La contraseña es obligatoria.");
      formularioValido = false;
    } else if (password.length < 8) {
      mostrarError("error-password", "Debe tener al menos 8 caracteres.");
      formularioValido = false;
    } else {
      ocultarError("error-password");
    }

    // 5. Confirmar contraseña
    let confirmar = document.getElementById("confirmar").value;
    if (confirmar === "") {
      mostrarError("error-confirmar", "Debes confirmar la contraseña.");
      formularioValido = false;
    } else if (confirmar !== password) {
      mostrarError("error-confirmar", "Las contraseñas no coinciden.");
      formularioValido = false;
    } else {
      ocultarError("error-confirmar");
    }

    // 6. Género: Masculino o Femenino
    let masculino = document.getElementById("genero-m").checked;
    let femenino = document.getElementById("genero-f").checked;
    if (!masculino && !femenino) {
      mostrarError("error-genero", "Selecciona una opción de género.");
      formularioValido = false;
    } else {
      ocultarError("error-genero");
    }


    let terminos = document.getElementById("terminos").checked;
    if (!terminos) {
      mostrarError("error-terminos", "Debes aceptar los términos y condiciones.");
      formularioValido = false;
    } else {
      ocultarError("error-terminos");
    }

    if (formularioValido) {
      document.getElementById("mensaje-exito").style.display = "block";
    } else {
      document.getElementById("mensaje-exito").style.display = "none";
    }

    return formularioValido;
  }

</script>

</body>
</html>
